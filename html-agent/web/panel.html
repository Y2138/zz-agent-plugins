<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML Agent · 只读助手</title>
  <link rel="stylesheet" href="/panel.css">
  <script id="bootstrap" type="application/json">BOOTSTRAP_JSON</script>
  <script type="module" src="/panel.js"></script>
</head>
<body>
  <header>
    <div><span class="eyebrow">就在此处，读懂更多</span><h1>HTML Agent <span class="badge">只读</span></h1></div>
    <button id="close" class="icon" title="收起助手" aria-label="收起助手">×</button>
  </header>
  <section class="context"><span class="dot"></span><span id="page">正在连接当前页面…</span></section>
  <div id="selection" hidden></div>
  <main id="messages" aria-label="对话记录" aria-live="polite">
    <section id="welcome"><div class="mark">✳</div><h2>有疑问，就在这里问。</h2><p>解释当前内容，查阅目录资料，<br>或提供具体的修改建议。不会修改文件。</p><div class="examples"><button data-question="请用简洁的语言解释当前页面的重点。">这一页的重点是什么？</button><button data-question="请结合目录中的资料，说明当前页面结论的依据；找不到时请明确说明。">这些结论有什么依据？</button></div></section>
  </main>
  <details id="scope"><summary>读取范围与模型</summary><dl><dt>授权根目录（包含子目录）</dt><dd id="root"></dd><dt>模型服务</dt><dd id="model"></dd></dl><p>仅按需发送当前页面、选区、近期对话及相关文件片段。隐藏／敏感文件和链接文件默认排除。仅打开可信 HTML，原有页面脚本仍会运行。</p></details>
  <form id="form">
    <label id="consent-label"><input id="consent" type="checkbox">允许将相关内容发送给上述模型服务</label>
    <label class="sr-only" for="question">问题</label>
    <textarea id="question" maxlength="4000" rows="2" placeholder="针对当前页面提问，或先选中一段文字…"></textarea>
    <div class="actions"><button id="clear" type="button" class="quiet">清空对话</button><span id="status" role="status">正在连接…</span><button id="stop" type="button" hidden>停止</button><button id="send" type="submit" disabled>发送 ↑</button></div>
  </form>
</body>
</html>
